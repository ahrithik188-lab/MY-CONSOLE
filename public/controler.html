<!DOCTYPE html>
<html>

<head>
    <title>Controller</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>📱 CONTROLLER</h1>

<input id="name" placeholder="Your Name">

<button onclick="join()">
    JOIN
</button>

<div id="status">
    DISCONNECTED
</div>

<div id="controls" style="display:none;">

    <button onclick="press('up')">⬆️</button>

    <br>

    <button onclick="press('left')">⬅️</button>

    <button onclick="press('right')">➡️</button>

    <br>

    <button onclick="press('down')">⬇️</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io({
    transports: ["websocket", "polling"]
});

socket.on("connect", () => {

    document.getElementById("status")
        .innerHTML =
        "🟢 CONNECTED";
});

socket.on("disconnect", () => {

    document.getElementById("status")
        .innerHTML =
        "🔴 DISCONNECTED";
});

function join(){

    const name =
        document.getElementById("name").value;

    socket.emit("joinRoom", name);

    document.getElementById("controls")
        .style.display = "block";
}

function press(button){

    socket.emit("buttonPress", button);

    if(button === "left")
        socket.emit("menuMove", "left");

    if(button === "right")
        socket.emit("menuMove", "right");
}

</script>

</body>
</html>
